<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: ws: wss:;"
    />
    <title>Discord Token Launcher</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!-- Barre de titre custom -->
    <header class="titlebar">
      <div class="titlebar__drag">
        <div class="titlebar__brand">
          <span class="titlebar__logo">✦</span>
          <span class="titlebar__name">Token Launcher</span>
        </div>
      </div>
      <div class="titlebar__controls">
        <button class="winbtn" id="btn-min" title="Réduire" aria-label="Réduire">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect y="4.5" width="10" height="1" /></svg>
        </button>
        <button class="winbtn" id="btn-max" title="Agrandir" aria-label="Agrandir">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" /></svg>
        </button>
        <button class="winbtn winbtn--close" id="btn-close" title="Fermer" aria-label="Fermer">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1 L9 9 M9 1 L1 9" stroke="currentColor" stroke-width="1.2" /></svg>
        </button>
      </div>
    </header>

    <div class="app">
      <!-- Barre latérale : liste des comptes -->
      <aside class="sidebar">
        <div class="sidebar__head">
          <h1 class="sidebar__title">Comptes</h1>
          <span class="sidebar__count" id="account-count">0</span>
        </div>

        <div class="sidebar__list" id="account-list"></div>

        <div class="sidebar__actions">
          <button class="btn btn--primary" id="btn-add-login">
            <span class="btn__icon">＋</span> Ajouter via login Discord
          </button>
          <button class="btn btn--ghost" id="btn-add-token">Coller un token</button>
          <button class="btn btn--ghost" id="btn-grab-token">Récupérer mon token actuel</button>
        </div>
      </aside>

      <!-- Zone principale -->
      <main class="content">
        <div class="tabsbar" id="tabsbar"></div>

        <section class="stage" id="stage">
          <div class="welcome" id="welcome">
            <div class="welcome__badge">✦</div>
            <h2>Bienvenue sur ton Token Launcher</h2>
            <p>
              Ajoute autant de comptes Discord que tu veux, puis clique sur l'un d'eux pour
              ouvrir sa session connectée, isolée des autres.
            </p>
            <div class="welcome__cta">
              <button class="btn btn--primary" id="btn-add-login-2">Ajouter un compte</button>
            </div>
            <p class="welcome__note">
            
            </p>
          </div>
          <div class="webviews" id="webviews"></div>
        </section>
      </main>
    </div>

    <!-- Toasts -->
    <div class="toasts" id="toasts"></div>

    <!-- Modal générique -->
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div class="modal" id="modal"></div>
    </div>

    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
